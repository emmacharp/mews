name = "mews-pages"
pages_build_output_dir = "."
compatibility_date = "2026-03-19"

[[r2_buckets]]
binding = "PLAYLIST_BUCKET"
bucket_name = "mews-playlists"

[[durable_objects.bindings]]
name = "PLAYLIST_JOBS"
class_name = "PlaylistJob"
script_name = "mews-playlist-jobs"

[[durable_objects.bindings]]
name = "RATE_LIMITS"
class_name = "RateLimitBucket"
script_name = "mews-playlist-jobs"
