name = "mews-playlist-jobs"
main = "src/index.mjs"
compatibility_date = "2026-03-19"
compatibility_flags = [ "nodejs_compat" ]

[browser]
binding = "BROWSER"

[[r2_buckets]]
binding = "PLAYLIST_BUCKET"
bucket_name = "mews-playlists"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "PlaylistJob", "RateLimitBucket" ]
